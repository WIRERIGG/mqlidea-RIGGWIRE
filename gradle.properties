org.gradle.jvmargs=-Xmx4g
# The build daemon's JDK is selected by AUTO-DETECTION via gradle/gradle-daemon-jvm.properties
# (toolchainVersion), NOT by a hardcoded absolute path — so ./gradlew and gradlew.bat work on macOS,
# Windows, and Linux with no per-machine setup, as long as a JDK of that major version is installed
# and discoverable (a CLion/IDEA bundled JBR or any Temurin/JDK counts). The build targets Java 21
# via `options.release` in build.gradle.kts and runs its IDE/unit-test tasks on the JBR the IntelliJ
# Platform plugin downloads, so the daemon JDK only has to be >= that.
# Overrides, if detection ever misses your JDK: set JAVA_HOME, or add org.gradle.java.home=<path>
# to your user-level ~/.gradle/gradle.properties (do NOT hardcode it here — it is machine-specific).
