org.gradle.jvmargs=-Xmx4g
# JDK used to run Gradle and compile (must be a JBR/JDK 21+; the build targets Java 21 via
# `options.release` in build.gradle.kts). This is intentionally NOT hardcoded to an absolute path,
# so the repo builds on macOS, Windows, and Linux without edits. Point Gradle at your IDE's bundled
# JBR in ONE of these machine-local (uncommitted) ways:
#   * set JAVA_HOME before invoking ./gradlew (or gradlew.bat), or
#   * add `org.gradle.java.home=<path>` to your user-level ~/.gradle/gradle.properties, or
#   * pass -Dorg.gradle.java.home=<path> on the command line.
# Examples — macOS: /Applications/CLion.app/Contents/jbr/Contents/Home
#            Windows: C:\\Program Files\\JetBrains\\CLion <version>\\jbr
