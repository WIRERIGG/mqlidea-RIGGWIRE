#
# Gradle Daemon JVM criteria (Gradle 8.8+). Gradle auto-DETECTS an installed JDK of this major
# version to run the build daemon (macOS/Windows/Linux), so no machine needs org.gradle.java.home.
# 25 matches the JBR bundled with current CLion/IDEA and the Temurin 25 on the dev box; the build
# itself still targets Java 21 via `options.release`. If a machine has no JDK 25, either install one
# or set JAVA_HOME. Regenerate with: ./gradlew updateDaemonJvm --jvm-version=25
#
toolchainVersion=25
