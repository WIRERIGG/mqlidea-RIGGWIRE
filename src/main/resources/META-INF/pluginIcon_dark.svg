<!-- RIGGWIRE MQL — marketplace icon (rising candlestick chart), dark theme. GPL-3.0. -->
<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="2" width="36" height="36" rx="9" fill="#F04A4C"/>
  <!-- candle 1 (white, low) -->
  <line x1="11" y1="16" x2="11" y2="30" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="8" y="20" width="6" height="8" rx="1.3" fill="#ffffff"/>
  <!-- candle 2 (white, mid) -->
  <line x1="20" y1="11" x2="20" y2="29" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="17" y="15" width="6" height="11" rx="1.3" fill="#ffffff"/>
  <!-- candle 3 (green bullish, high) -->
  <line x1="29" y1="7" x2="29" y2="24" stroke="#42E68C" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="26" y="11" width="6" height="10" rx="1.3" fill="#42E68C"/>
</svg>
