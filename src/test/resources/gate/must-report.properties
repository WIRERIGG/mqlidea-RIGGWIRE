# Findings on MetaQuotes code checked by hand to be real; the corpus gate fails if one stops being reported.
# corpus.Inspection@path suffix = minimum count in that file. Counts only: no line numbers (MetaTrader updates
# move lines) and no code text (D-1). Add an entry only after reading the code; MQL_GATE_UPDATE never edits this.
# Math/Fuzzy/ruleparser.mqh: 'expressions' deleted, then deleted again in the else branch
include.DanglingObjectReference@Math/Fuzzy/ruleparser.mqh=1
# CMath::RandomReal retries by calling itself
include.StackOverflowRisk@Math/Alglib/ap.mqh=1
# CAblas::CMatrixTranspose splits and recurses
include.StackOverflowRisk@Math/Alglib/linalg.mqh=1
# CArrayObj::QuickSort recurses on each half
include.StackOverflowRisk@Arrays/ArrayObj.mqh=1
# X_Size(const int Y) / Y_Size(const int Y) never read Y
include.UnusedParameter@ChartObjects/ChartObjectPanel.mqh=2
